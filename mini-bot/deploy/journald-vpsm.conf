# journald settings for a host whose logs VPSM reads (`mini-bot logs`).
# Installed by install.sh to /etc/systemd/journald.conf.d/vpsm.conf.
#
# journald is the log store on the VPS: Docker containers reach it through
# Docker's journald log driver, systemd units (Caddy) natively. mini-bot
# copies nothing; the laptop pulls with journald's cursor.

[Journal]
# Keep logs across reboots. The default ("auto") only persists if
# /var/log/journal already exists, which not every distro creates.
Storage=persistent

# The hard cap on disk. journald's own default is 10% of the filesystem
# (capped at 4G); stating it keeps the budget visible and stable if the disk
# is resized. Entries are compressed, so 2G holds a good deal of text.
SystemMaxUse=2G
MaxRetentionSec=30day

# journald's default rate limit silently drops a service's messages past
# 10000 per 30s. A container stuck in a crash loop is exactly when the logs
# matter, so don't drop them; SystemMaxUse still bounds the disk.
RateLimitIntervalSec=0
